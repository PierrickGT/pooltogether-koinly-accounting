[package]
name = "pooltogether-koinly-accounting"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "0.3.6", features = ["full"] }
alloy-chains = "0.2"
chrono = "0.4.43"
colored = "2.2.0"
csv = "1.4.0"
dotenv = "0.15.0"
eyre = "0.6.12"
fern = { version = "0.6.2", features = ["colored"] }
futures-util = "0.3.31"
indicatif = "0.18"
indicatif-log-bridge = "0.2.3"
indoc = "2.0.7"
log = "0.4.29"
once_cell = "1.21.3"
op-alloy-rpc-types = "0.2.12"
reqwest = { version = "0.12.28", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tokio-retry = "0.3.0"
